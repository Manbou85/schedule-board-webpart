<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行動予定表プレビュー</title>
<style>
  body { margin: 0; background: #faf9f8; font-family: 'Segoe UI', 'Segoe UI Web (West European)', -apple-system, BlinkMacSystemFont, 'Yu Gothic UI', Meiryo, sans-serif; } /* SharePoint の書体に近づける(WEBパーツは SharePoint の書体を受け継ぐ) */
  .pv-page { max-width: 1280px; margin: 0 auto; padding: 16px; }
  .pv-note { margin: 0 0 12px; padding: 8px 12px; font: 13px/1.5 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif;
             color: #5c4400; background: #fff4ce; border: 1px solid #f0d77a; border-radius: 6px; }
  /* SharePoint の全幅のセクションと同じように、入れ物の余白は 0(余白は WEBパーツの中で付ける) */
  /* transform は SharePoint のページのまね:WEBパーツの中に「画面に固定」で置いたものが、画面ではなく入れ物に固定される。
     プレビューでも同じ問題に気づけるように、わざと付けている */
  .pv-card { padding: 0; background: #fff; border: 1px solid #e1dfdd; border-radius: 8px; transform: translateZ(0); }
  .pv-controls { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: -4px 0 12px; padding: 6px 12px;
                 font: 13px/1.5 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif; color: #5c4400; background: #fff4ce;
                 border: 1px solid #f0d77a; border-radius: 6px; }
  .pv-controls label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .pv-controls-title { font-weight: 600; }
  .pv-footer { margin-top: 12px; font: 12px 'Segoe UI', Meiryo, sans-serif; color: #8a8886; }
  @media (max-width: 640px) { .pv-page { padding: 8px; } .pv-card { padding: 0; } }
/*__CSS__*/
</style>
</head>
<body>
<div class="pv-page">
  <p class="pv-note">プレビュー版です。データはすべて架空のダミーで、登録した予定はページを開いている間だけ残り、開き直すと元に戻ります。「あなた」はダミーの建築部の1人目です。</p>
  <div id="pv-root"></div>
  <p class="pv-footer">/*__FOOTER__*/</p>
</div>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
